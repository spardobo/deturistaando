[supervisord]
; Remain in the foreground as the container's PID 1 process.
nodaemon=true

; Disable Supervisor's own file log; child services use standard streams.
logfile=/dev/null
logfile_maxbytes=0

; Keep the rootless Supervisor PID in a writable runtime location.
pidfile=/tmp/supervisord.pid

; Run the process manager and every child without root privileges.
user=www-data

[program:php-fpm]
; Run PHP-FPM in the foreground so exits are observable.
command=php-fpm --nodaemonize

; Start PHP-FPM before Nginx begins accepting traffic.
priority=10

; Recover the application service after an unexpected process exit.
autorestart=true

; Treat a successful spawn as running immediately.
startsecs=0

; Allow graceful shutdown before Supervisor sends a kill signal.
stopwaitsecs=10

; Propagate stop and kill signals to the complete process group.
stopasgroup=true
killasgroup=true

; Forward service output directly to Docker's log collector.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; Keep Nginx in the foreground and force diagnostics to standard error.
command=nginx -e /dev/stderr -g "daemon off;"

; Start Nginx after the lower-priority PHP-FPM program.
priority=20

; Recover the web server after an unexpected process exit.
autorestart=true

; Treat a successful spawn as running immediately.
startsecs=0

; Allow graceful shutdown before Supervisor sends a kill signal.
stopwaitsecs=10

; Propagate stop and kill signals to the complete process group.
stopasgroup=true
killasgroup=true

; Forward service output directly to Docker's log collector.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
