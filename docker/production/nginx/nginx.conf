# Scale workers to the CPU resources visible to this container.
worker_processes auto;

# Provide enough file descriptors for concurrent sockets and static files.
worker_rlimit_nofile 4096;

# Store the rootless master PID in a writable runtime location.
pid /tmp/nginx.pid;

# Keep container diagnostics on the standard error stream.
error_log /dev/stderr warn;

events {
    # Bound concurrent connections per worker for a medium-traffic baseline.
    worker_connections 1024;

    # Drain queued connections efficiently during short traffic bursts.
    multi_accept on;
}

http {
    # Serve static assets with authoritative content types.
    include /etc/nginx/mime.types;

    # Treat unknown file types as binary data rather than guessing a type.
    default_type application/octet-stream;

    # Emit request logs to Docker's standard output collector.
    access_log /dev/stdout;

    # Use kernel-assisted file transfers for static responses.
    sendfile on;

    # Coalesce response headers and file data into efficient packets.
    tcp_nopush on;

    # Reuse client connections briefly without retaining them indefinitely.
    keepalive_timeout 15;

    # Avoid disclosing the installed Nginx version in responses.
    server_tokens off;

    # Reserve a balanced MIME hash for the bundled type table.
    types_hash_max_size 2048;

    # Keep all request buffering in explicit Nginx-owned paths. These paths are
    # created and assigned to www-data at build time for sustained rootless use.
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    # Load versioned virtual hosts after global HTTP defaults are established.
    include /etc/nginx/http.d/*.conf;
}
