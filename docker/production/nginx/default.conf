upstream php-fpm {
    # Use a filesystem socket for same-container FastCGI traffic, avoiding
    # loopback TCP overhead without exposing the application worker.
    server unix:/run/php-fpm/php-fpm.sock;
}

server {
    # Listen on an unprivileged port so the server never requires root.
    listen 8080;

    # Accept the host selected by the trusted deployment edge.
    server_name _;

    # Expose only Laravel's public directory to HTTP clients.
    root /var/www/html/public;

    # Route directory requests through Laravel's public front controller.
    index index.php;

    # Keep directory contents private even if an index file is absent.
    autoindex off;

    # Bound request bodies to match PHP's production post limit.
    client_max_body_size 10m;

    # Apply a minimal CSP that protects framing, base URLs, and object embeds
    # without breaking Livewire's runtime script and style requirements.
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Disable browser capabilities that the application does not require.
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Preserve useful referrers on the same origin while limiting leakage.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Prevent browsers from interpreting content as an undeclared type.
    add_header X-Content-Type-Options "nosniff" always;

    # Retain legacy clickjacking protection alongside CSP frame-ancestors.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Disable the obsolete browser XSS auditor, which can introduce risk.
    add_header X-XSS-Protection "0" always;

    location ~ ^/livewire-[a-f0-9]+/ {
        # Livewire 4 serves scripts, updates, previews, and uploads through
        # an APP_KEY-derived route; never treat these endpoints as static files.
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        # Serve real public files directly and send all other paths to Laravel.
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/assets/ {
        # Never fall through to Laravel when a fingerprinted asset is absent.
        try_files $uri =404;

        # Vite fingerprints these files, so one-year browser caching is safe.
        expires 1y;

        # Avoid high-volume access logs for immutable frontend assets.
        access_log off;

        # Missing fingerprinted assets are expected during rolling deployments.
        log_not_found off;

        # Compress only public build assets, avoiding compression of dynamic
        # responses that may contain secrets and be exposed to BREACH-style risk.
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/javascript application/json image/svg+xml text/css;
        gzip_vary on;
    }

    location = /index.php {
        # Forward only the public front controller to PHP-FPM.
        include fastcgi_params;

        # Resolve the exact script path expected by the FastCGI worker.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Remove the legacy HTTP_PROXY variable to prevent proxy injection.
        fastcgi_param HTTP_PROXY "";

        # Route through the private Unix socket without persistent FastCGI
        # connections, so idle Nginx connections do not retain FPM workers.
        fastcgi_pass php-fpm;

        # Fail quickly when PHP-FPM cannot accept a connection.
        fastcgi_connect_timeout 5s;

        # Bound time spent transmitting a request to PHP-FPM.
        fastcgi_send_timeout 60s;

        # Allow a small margin beyond PHP's request termination timeout.
        fastcgi_read_timeout 65s;

        # Buffer typical framework headers and responses without disk churn.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
    }

    location ~ \.php$ {
        # Reject every executable PHP path except the explicit front controller.
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        # Hide dotfiles while preserving Laravel's required .well-known routes.
        deny all;
    }
}
