; Hide the PHP version from response headers.
expose_php = Off

; Report failures through logs without exposing internals to clients.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Send PHP diagnostics to the container's standard error stream.
error_log = /proc/self/fd/2

; Bound memory consumed by any individual request.
memory_limit = 128M

; Terminate unexpectedly long scripts before they exhaust worker capacity.
max_execution_time = 60

; Bound request parsing time separately from application execution.
max_input_time = 60

; Accept multipart overhead while keeping the full request within Nginx's limit.
post_max_size = 10M

; Limit each uploaded file below the complete request-body ceiling.
upload_max_filesize = 8M
